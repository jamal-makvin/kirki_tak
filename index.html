<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мир блоков</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
      background: #fff;
    }
    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }
    header strong {
      font-size: 24px;
      color: #3d7d22;
    }
    main {
      width: min(900px, calc(100% - 32px));
      margin: 40px auto;
      text-align: center;
    }
    img {
      display: block;
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border: 4px solid #333;
    }
    h1 {
      margin: 30px 0 12px;
      font-size: clamp(34px, 7vw, 60px);
      color: #38761d;
    }
    p {
      max-width: 620px;
      margin: 0 auto 25px;
      font-size: 18px;
      line-height: 1.5;
      color: #555;
    }
    button {
      padding: 15px 28px;
      border: 3px solid #222;
      background: #62a83b;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 4px 4px 0 #222;
    }
    button:active {
      transform: translate(4px, 4px);
      box-shadow: none;
    }
    footer {
      margin-top: 50px;
      padding: 22px;
      text-align: center;
      color: #777;
      background: #f3f3f3;
      border-top: 1px solid #ddd;
    }
  </style>

</head>
<body>
  <header><strong>МИР БЛОКОВ</strong></header>

  <main>
    <img src="voxel-valley.png" alt="Кубический игровой мир">
    <h1>Добро пожаловать!</h1>
    <p>Строй дома, исследуй новые земли и создавай собственные приключения в мире блоков.</p>
    <button type="button" onclick="location.reload()">НАЧАТЬ ИГРАТЬ</button>
  </main>

  <footer>© 2026 Мир блоков</footer>
</body>
</html>
